# Backend + IA together. Expects the AI repo next to this one:  ../pqrsd-router-ai
# (or replace `build:` with an image once you publish it).
# Usage:  docker compose up --build   (demo staff keys below are for a local demo only: override STAFF_API_KEY / STAFF_USERS)
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pqrsd
      POSTGRES_PASSWORD: pqrsd
      POSTGRES_DB: pqrsd
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pqrsd"]
      interval: 5s
      retries: 10
  ai:
    build: ../pqrsd-router-ai
    depends_on:
      db: { condition: service_healthy }
    environment:
      MODELS_DIR: /data/models
      FEEDBACK_FILE: /data/feedback/feedback.jsonl
      DATABASE_URL: postgresql://pqrsd:pqrsd@db:5432/pqrsd
      AI_API_KEY: ${AI_API_KEY:-}
    volumes:
      - ai-models:/data/models
      - ai-feedback:/data/feedback
    ports:
      - "8000:8000"
  backend:
    build: .
    depends_on:
      db: { condition: service_healthy }
      ai: { condition: service_started }
    environment:
      PORT: 3001
      DATA_DIR: /data
      DATABASE_URL: postgres://pqrsd:pqrsd@db:5432/pqrsd
      AI_URL: http://ai:8000
      AI_API_KEY: ${AI_API_KEY:-}
      STAFF_API_KEY: ${STAFF_API_KEY:-demo-funcionario-2026}
      STAFF_USERS: ${STAFF_USERS:-Ana Pérez:ana-demo-2026,Luis Ruiz:luis-demo-2026}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
      TRUST_PROXY: ${TRUST_PROXY:-0}
    volumes:
      - backend-data:/data
    ports:
      - "3001:3001"
volumes:
  db-data:
  ai-models:
  ai-feedback:
  backend-data:
