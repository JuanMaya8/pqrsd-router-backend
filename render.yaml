# Render Blueprint: backend (NestJS) + AI (FastAPI). Database: Neon (PostgreSQL). Frontend: Vercel. See docs/DEPLOY.md.
# Render → New → Blueprint → pick this repo. Values marked `sync: false` are asked for on the first deploy
# (DATABASE_URL: the SAME Neon URL in both services; the backend uses tables pq_*, the AI uses ai_feedback).
# Free plans: services sleep after ~15 min idle (first request takes ~1 min). Neon free does not expire.

services:
  - type: web
    name: pqrsd-router-ai
    runtime: python
    repo: https://github.com/JuanMaya8/pqrsd-router-ai
    branch: main
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # shared secret: the backend sends it as X-API-Key (copied below with fromService)
      - key: AI_API_KEY
        generateValue: true
      # corrections survive deploys in Postgres (table ai_feedback); the model is retrained from them at boot
      # Neon connection string (Neon → Connect → copy it), e.g.
      # postgresql://user:password@ep-xxxx.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: DATABASE_URL
        sync: false
      - key: BOOTSTRAP_SAMPLES
        value: "6000"

  - type: web
    name: pqrsd-router-backend
    runtime: node
    repo: https://github.com/JuanMaya8/pqrsd-router-backend
    branch: main
    plan: free
    # --include=dev: the Nest CLI and TypeScript are devDependencies and NODE_ENV=production would skip them
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node dist/main.js
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_VERSION
        value: 20.18.1
      - key: NODE_ENV
        value: production
      # mandatory in production; read it in the Render dashboard and type it in /funcionario
      - key: STAFF_API_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: pqrsd-db
          property: connectionString
      # public URL of the AI service, e.g. https://pqrsd-router-ai.onrender.com
      - key: AI_URL
        sync: false
      - key: AI_API_KEY
        fromService:
          type: web
          name: pqrsd-router-ai
          envVarKey: AI_API_KEY
      # the AI may be waking up: after this the fallback classifier answers and the AI is skipped for 20 s
      - key: AI_TIMEOUT_MS
        value: "10000"
      # the Vercel domain(s), comma-separated, e.g. https://pqrsd-router.vercel.app
      - key: CORS_ORIGINS
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
      # Render puts one proxy in front of the app: rate limiting must see the real client IP
      - key: TRUST_PROXY
        value: "1"
      # optional citizen e-mails, e.g. smtps://user:password@smtp.gmail.com:465 (empty = no e-mails)
      - key: SMTP_URL
        sync: false
      - key: MAIL_FROM
        sync: false
